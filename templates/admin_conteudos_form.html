{% extends "base.html" %}
{% block body_class %}admin-area{% endblock %}
{% block top_bar %}
<div class="top-bar bg-dark text-white d-flex justify-content-between align-items-center p-2">
    <div class="user-info ms-3">
        Olá, bem-vindo {{ usuario.nome if usuario else '' }}
    </div>
    <div class="top-bar-buttons me-3">
        <a href="{{ url_for('logout') }}" class="btn btn-danger btn-sm">Logout</a>
    </div>
</div>
{% endblock %}

{% block content %}

<!-- Summernote CSS -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/summernote/0.8.20/summernote-lite.min.css" rel="stylesheet">

<div class="container mt-5">
    <h2 class="mb-3" style="color:#FFD700;">
        {{ conteudo and "✏️ Editar Conteúdo" or "➕ Adicionar Novo Conteúdo" }}
    </h2>

    <form method="post">
        <div class="mb-3">
            <label class="form-label">Título:</label>
            <input type="text" name="titulo" class="form-control"
                   value="{{ conteudo.titulo if conteudo else '' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Descrição:</label>
            <textarea name="descricao" class="form-control" required>{{ conteudo.descricao if conteudo else '' }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Texto completo do conteúdo:</label>
            <textarea id="editor" name="texto">{{ conteudo.texto | safe if conteudo else '' }}</textarea>
        </div>

        <button type="submit" class="btn salvar-btn me-2">Salvar</button>
        <a href="{{ url_for('admin_conteudos_trilha', trilha_id=trilha.id) }}" class="btn voltar-btn">Voltar</a>
    </form>
</div>

<!-- Summernote JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/summernote/0.8.20/summernote-lite.min.js"></script>

<script>
$(document).ready(function() {
    $('#editor').summernote({
        placeholder: 'Escreva o conteúdo aqui...',
        tabsize: 2,
        height: 350,
        minHeight: 300,
        maxHeight: null,
        toolbar: [
            ['style', ['bold', 'italic', 'underline', 'clear']],
            ['font', ['fontsize', 'color']],
            ['para', ['ul', 'ol', 'paragraph']],
            ['insert', ['link', 'picture', 'video']],
            ['view', ['codeview']]
        ]
    });
});
</script>

<style>
.note-editor.note-frame {
    background-color: #121212;
    color: #e0e0e0;
}

.note-editable {
    background-color: #1c1c1c !important;
    color: #fff !important;
}
</style>

{% endblock %}
